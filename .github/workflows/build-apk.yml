name: Build Android Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Node / pnpm ──────────────────────────────────────────────────────
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      # ── Install Capacitor inside the tradermind package ──────────────────
      - name: Install Capacitor packages
        working-directory: artifacts/tradermind
        run: |
          pnpm add @capacitor/core@^6 @capacitor/android@^6
          pnpm add -D @capacitor/cli@^6

      # ── Build web app ────────────────────────────────────────────────────
      - name: Build TraderMind web
        working-directory: artifacts/tradermind
        run: pnpm run build
        env:
          PORT: 23583
          BASE_PATH: /
          NODE_ENV: production

      # ── Java & Android SDK ───────────────────────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ── Capacitor: init Android project ─────────────────────────────────
      - name: Add Capacitor Android platform
        working-directory: artifacts/tradermind
        run: npx cap add android

      - name: Sync web assets into Android project
        working-directory: artifacts/tradermind
        run: npx cap sync android

      # ── Gradle build ─────────────────────────────────────────────────────
      - name: Make gradlew executable
        working-directory: artifacts/tradermind/android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: artifacts/tradermind/android
        run: ./gradlew assembleDebug --no-daemon

      # ── Upload APK ────────────────────────────────────────────────────────
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tradermind-debug
          path: artifacts/tradermind/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
